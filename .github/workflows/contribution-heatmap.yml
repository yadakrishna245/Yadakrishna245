# Builds the contribution heatmap from real GitHub contribution data
# and publishes the SVGs to the "output" branch (used by README.md).
name: Contribution heatmap

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/contribution-heatmap.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-heatmap.svg?color_snake=#F8F0F3&color_dots=#190B12,#451126,#701A3D,#C77B9B,#E5B5C7&color_dot_border=#10070C
            dist/contribution-heatmap-dark.svg?palette=github-dark&color_snake=#F8F0F3&color_dots=#190B12,#451126,#701A3D,#C77B9B,#E5B5C7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
